syntax = "proto3";

package gohome.config.v1;

option go_package = "github.com/joshp123/gohome/proto/gen/config/v1;configv1";

import "proto/plugins/tado.proto";
import "proto/plugins/daikin.proto";
import "proto/plugins/growatt.proto";
import "proto/plugins/roborock.proto";
import "proto/plugins/p1_homewizard.proto";
import "proto/plugins/airgradient.proto";
import "proto/plugins/weheat.proto";
import "proto/plugins/shelly.proto";
import "proto/plugins/hikvision.proto";
import "proto/plugins/sonos.proto";
import "proto/plugins/casambi.proto";

message CoreConfig {
  string grpc_addr = 1;
  string http_addr = 2;
  reserved 3;
  reserved "dashboard_dir";
}

message OAuthConfig {
  string blob_endpoint = 1;
  string blob_bucket = 2;
  string blob_prefix = 3;
  string blob_access_key_file = 4;
  string blob_secret_key_file = 5;
  string blob_region = 6;
  optional bool refresh_enabled = 7;
  uint32 refresh_interval_seconds = 8;
}

message Config {
  uint32 schema_version = 1;
  CoreConfig core = 2;
  OAuthConfig oauth = 3;
  gohome.plugins.tado.v1.TadoConfig tado = 10;
  gohome.plugins.daikin.v1.DaikinConfig daikin = 11;
  gohome.plugins.growatt.v1.GrowattConfig growatt = 12;
  gohome.plugins.roborock.v1.RoborockConfig roborock = 13;
  gohome.plugins.p1_homewizard.v1.P1HomewizardConfig p1_homewizard = 14;
  gohome.plugins.airgradient.v1.AirgradientConfig airgradient = 15;
  gohome.plugins.weheat.v1.WeheatConfig weheat = 16;
  reserved 17;
  reserved "home";
  gohome.plugins.shelly.v1.ShellyConfig shelly = 18;
  gohome.plugins.hikvision.v1.HikvisionConfig hikvision = 19;
  gohome.plugins.sonos.v1.SonosConfig sonos = 20;
  gohome.plugins.casambi.v1.CasambiConfig casambi = 21;
}
