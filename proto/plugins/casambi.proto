syntax = "proto3";

package gohome.plugins.casambi.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/joshp123/gohome/proto/gen/plugins/casambi/v1;casambiv1";

// Casambi Bluetooth lights and switches, read through the light bridge, which
// owns the only Bluetooth session to the Casambi network. The bridge serves
// CasambiService; gohome's casambi plugin serves the same service by calling it.
// Reads only: nothing here sends anything to a light.

message ListLightsRequest {}

message Light {
  // Casambi unit UUID. Stable across renames.
  string id = 1;
  // The name the bridge shows in Apple Home.
  string name = 2;
  // The bridge has a Bluetooth session and the light's last report said it was online.
  bool online = 3;
  // The light's last report. Absent until the light has reported since the bridge started.
  optional bool on = 4;
  // The light's dimmer level, 0 to 100. Present only while the light is on:
  // an off light has no brightness.
  optional uint32 brightness_percent = 5;
  // When the bridge last received a report from this light. Absent until the first report.
  google.protobuf.Timestamp last_report_time = 6;
  // The colour of the colour LEDs, present only while the light is on and its
  // colour LEDs are lit (see lit_channels). Casambi reports colour as hue and
  // saturation; how bright is brightness_percent.
  // Hue, 0 to 359 degrees. Absent when saturation is 0, where hue has no meaning.
  optional uint32 hue_degrees = 7;
  // Saturation, 0 (white) to 100 (pure colour).
  optional uint32 saturation_percent = 8;
  // For lights with colour and white LEDs, present only while the light is on:
  // Casambi's mixer between them, 0 to 63. At 0 only the white LEDs are lit;
  // at 63 only the colour LEDs. 31 is Casambi's default.
  optional uint32 white_colour_balance = 9;
  // For drivers with an overheat indicator: the driver's raw indicator, 0 to 3.
  // 0 is Casambi's default; Casambi does not document the other values.
  optional uint32 overheat_indicator = 10;
  // For lights with colour and white LEDs, while the light is on: which of them are lit.
  LitChannels lit_channels = 11;
}

// Which LEDs of a light with colour and white LEDs are lit. The white LEDs have
// one fixed colour temperature, which the light does not report.
enum LitChannels {
  // Not a light with colour and white LEDs, or the light is off.
  LIT_CHANNELS_UNSPECIFIED = 0;
  LIT_CHANNELS_WHITE = 1;
  LIT_CHANNELS_COLOUR = 2;
  LIT_CHANNELS_WHITE_AND_COLOUR = 3;
}

message ListLightsResponse {
  // Every light the bridge exposes to Apple Home, in Apple Home accessory order.
  repeated Light lights = 1;
  // The bridge currently holds an authenticated Bluetooth session.
  bool bluetooth_connected = 2;
}

message ListScenesRequest {}

message Scene {
  // Native Casambi scene ID.
  uint32 id = 1;
  // The name the bridge shows in Apple Home.
  string name = 2;
  // The bridge is connected and the Casambi network has this scene.
  bool available = 3;
}

message ListScenesResponse {
  // Scenes the bridge is configured to expose.
  repeated Scene scenes = 1;
}

message ListSwitchesRequest {}

// What a switch button addresses, by the Casambi network configuration.
enum ButtonTargetKind {
  BUTTON_TARGET_KIND_UNSPECIFIED = 0;
  // The configuration names no light, group or scene for the button.
  BUTTON_TARGET_KIND_NONE = 1;
  BUTTON_TARGET_KIND_LIGHT = 2;
  BUTTON_TARGET_KIND_GROUP = 3;
  BUTTON_TARGET_KIND_SCENE = 4;
  // Anything else, such as several scenes or a light the network does not have;
  // casambi_action_type is the only description.
  BUTTON_TARGET_KIND_OTHER = 5;
}

// What a button is configured to do, read from the Casambi network
// configuration the bridge loads when it connects. Casambi does not document
// the configuration's action type codes, so this reports what the button
// addresses, and the raw code alongside. The Casambi manual: a press turns the
// target on and a second press turns it off (unless the switch's toggle is
// disabled); holding a button, or the switch's + and - buttons, dims it.
message ButtonAction {
  ButtonTargetKind target_kind = 1;
  // The target's Casambi ID: the light's device ID, the group ID or the scene
  // ID. 0 for NONE and OTHER.
  uint32 target_casambi_id = 2;
  // A light's name as Apple Home shows it, or its Casambi name when the bridge
  // does not expose it; a group's or scene's Casambi name.
  string target_name = 3;
  // The lights the target addresses, by Casambi unit UUID: the light, the
  // group's lights or the lights the scene sets.
  repeated string light_ids = 4;
  // Casambi's own action type code for the button. Undocumented.
  uint32 casambi_action_type = 5;
  // The configuration stops holding the button from dimming the target.
  bool dimming_disabled = 6;
}

message SwitchButton {
  // Button number, 1 upwards, as casambi-bt numbers the switch's buttons. The
  // configuration numbers buttons from 0; the bridge takes configured button i
  // to be button i+1. A press's light_changes show whether that holds.
  uint32 number = 1;
  // Presses the bridge has seen since it started.
  uint64 presses = 2;
  // When the bridge last saw this button pressed. Absent until the first press.
  google.protobuf.Timestamp last_press_time = 3;
  // What the configuration says the button does. Absent when the
  // configuration has nothing for this number.
  ButtonAction action = 4;
}

message Switch {
  // Casambi unit UUID.
  string id = 1;
  // The switch's name in the Casambi network.
  string name = 2;
  // The bridge has a Bluetooth session and the switch's last report said it was online.
  bool online = 3;
  // The switch's raw battery level, 0 to 255, on Casambi's undocumented scale.
  // Absent until the switch has reported since the bridge started.
  optional uint32 battery_level = 4;
  // When the bridge last received a state report from this switch. Absent until the first report.
  google.protobuf.Timestamp last_report_time = 5;
  // The buttons the configuration lists, and any other button the bridge has
  // seen pressed since it started, by number.
  repeated SwitchButton buttons = 6;
  // The configuration turns every light off when a button is held for about
  // five seconds.
  bool long_press_turns_all_off = 7;
  // The configuration makes a press only turn its target on, never off.
  bool toggle_disabled = 8;
}

message ListSwitchesResponse {
  // Every wall switch in the Casambi network.
  repeated Switch switches = 1;
  // The bridge currently holds an authenticated Bluetooth session.
  bool bluetooth_connected = 2;
}

message ListSwitchPressesRequest {}

// A light that reported a state different from its state just before a press
// while the press was under observation.
message LightChange {
  // Casambi unit UUID.
  string light_id = 1;
  // As Apple Home shows it, or the Casambi name when the bridge does not expose the light.
  string name = 2;
  // Absent when the light had not reported since the bridge started.
  optional bool on_before = 3;
  bool on_after = 4;
  // Before is the state just before the press; after is the state at
  // observed_until, which equals before when the light changed and changed back.
  // Brightness and colour are present only while the light was on, and colour
  // only for colour lights, as in Light.
  optional uint32 brightness_percent_before = 5;
  optional uint32 brightness_percent_after = 6;
  optional uint32 hue_degrees_before = 7;
  optional uint32 hue_degrees_after = 8;
  optional uint32 saturation_percent_before = 9;
  optional uint32 saturation_percent_after = 10;
  optional uint32 white_colour_balance_before = 11;
  optional uint32 white_colour_balance_after = 12;
}

// One press of a switch button, and what the lights did after it. The bridge
// only observes: it compares the light reports it receives anyway.
message SwitchPress {
  string switch_id = 1;
  string switch_name = 2;
  // Button number, as in SwitchButton.
  uint32 button = 3;
  // What the configuration says the button does. Absent when the
  // configuration has nothing for this number.
  ButtonAction configured_action = 4;
  google.protobuf.Timestamp press_time = 5;
  // The switch reported the button held (a long press) before its release.
  bool held = 6;
  // Absent when the bridge saw no release.
  google.protobuf.Timestamp release_time = 7;
  // The end of the observation: a few seconds after the button's last event,
  // or the next press of any button, whichever came first.
  google.protobuf.Timestamp observed_until = 8;
  // Lights that reported an on/off state, brightness or colour different from
  // just before the press, at any time until observed_until. A light with a
  // switch-off delay can change after observed_until. Anything else that
  // changed a light in that time, such as Apple Home, shows here too.
  repeated LightChange light_changes = 9;
  // The bridge lost its Bluetooth session before the observation ended, so
  // observed_until is when it did and later changes are missing.
  bool observation_interrupted = 10;
}

message ListSwitchPressesResponse {
  // The most recent presses since the bridge started, oldest first, at most
  // 100. A press appears once its observation has ended.
  repeated SwitchPress presses = 1;
}

message CasambiConfig {
  // host:port of the bridge's gRPC API, e.g. "bridge.example.ts.net:50061".
  string bridge_address = 1;
}

service CasambiService {
  rpc ListLights(ListLightsRequest) returns (ListLightsResponse);
  rpc ListScenes(ListScenesRequest) returns (ListScenesResponse);
  rpc ListSwitches(ListSwitchesRequest) returns (ListSwitchesResponse);
  rpc ListSwitchPresses(ListSwitchPressesRequest) returns (ListSwitchPressesResponse);
}
