syntax = "proto3";

package gohome.plugins.shelly.v1;

option go_package = "github.com/joshp123/gohome/proto/gen/plugins/shelly/v1;shellyv1";

import "google/protobuf/timestamp.proto";

// One roller shutter driven by a Shelly relay in cover mode.
message CoverConfig {
  // The relay's own ID, e.g. "Shelly2PMG3-AAAAAAAAAAAA". A read fails if the
  // relay at `address` reports a different ID.
  string device_id = 1;
  // Host or IP on the home network, e.g. "192.0.2.30".
  string address = 2;
  // Human name used in the API, metrics and dashboards.
  string name = 3;
}

message ShellyConfig {
  repeated CoverConfig covers = 1;
}

message ListCoversRequest {}

message Cover {
  string device_id = 1;
  string name = 2;
  string address = 3;
  // Set when the relay could not be read; no state fields are set then.
  string read_error = 4;
  // When gohome read this state from the relay.
  google.protobuf.Timestamp read_at = 5;
  // 0 is fully closed, 100 fully open. The relay estimates it from motor run
  // time; absent when the relay does not know it.
  optional int32 position_percent = 6;
  // Where the shutter is heading; equals position when it is still.
  optional int32 target_position_percent = 7;
  // The motor is running (moving, stopping or calibrating).
  bool moving = 8;
  // The relay has measured the shutter's full travel time.
  bool calibrated = 9;
  // The relay's state word: idle, move, rampup, moving, stop, stopping,
  // precal0..postcal1 (calibration) or error.
  string state = 10;
 optional SystemReading system = 25;
 string system_read_error = 26;
  // Relay uptime in seconds.
  optional double uptime_seconds = 11;
  // Relay failsafe mode.
  optional bool failsafe = 12;
  // Relay overheat protection active.
  optional bool overheat = 13;
  // HomeKit server running.
  optional bool homekit_running = 14;
  // HomeKit paired.
  optional bool homekit_paired = 15;
  // Active HomeKit connections.
  optional double homekit_connections = 16;
  // Pending HomeKit connections.
  optional double homekit_pending_connections = 17;
  // Wi-Fi connected.
  optional bool wifi_connected = 18;
  // Wi-Fi connection in progress.
  optional bool wifi_connecting = 19;
  // Firmware update progress; minus one means no update.
  optional double ota_progress_percent = 20;
  // Calibrated full travel time in seconds.
  optional double cover_calibration_travel_seconds = 21;
  // Motor power measured during calibration, not live power.
  optional double cover_calibration_power_watts = 22;
  optional double device_temperature_celsius = 23;
  optional double wifi_rssi_dbm = 24;
}

message ListCoversResponse {
  repeated Cover covers = 1;
}

service ShellyService {
  // Reads every configured shutter live from its relay.
  rpc ListCovers(ListCoversRequest) returns (ListCoversResponse);
}

message SystemReading {
 optional double ram_size_bytes = 1;
 optional double ram_free_bytes = 2;
 optional double ram_min_free_bytes = 3;
 optional double filesystem_size_bytes = 4;
 optional double filesystem_free_bytes = 5;
}
