syntax = "proto3";

package gohome.plugins.hikvision.v1;

option go_package = "github.com/joshp123/gohome/proto/gen/plugins/hikvision/v1;hikvisionv1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// What the camera says it detected. The camera's own word is kept in
// CameraEvent.camera_target; this is that word in a fixed vocabulary.
enum DetectionTarget {
  // The camera did not say. Motion events never say, even when motion
  // detection is filtered to people and vehicles.
  DETECTION_TARGET_UNSPECIFIED = 0;
  DETECTION_TARGET_HUMAN = 1;
  DETECTION_TARGET_VEHICLE = 2;
  // The camera's "all": people and vehicles.
  DETECTION_TARGET_ALL = 3;
  // A word this plugin does not know yet.
  DETECTION_TARGET_OTHER = 4;
}

// The kind of on-camera event. The camera's own word is in CameraEvent.camera_event_type.
enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_MOTION = 1;          // VMD
  EVENT_KIND_LINE_CROSSING = 2;   // linedetection
  EVENT_KIND_INTRUSION = 3;       // fielddetection
  EVENT_KIND_REGION_ENTRANCE = 4; // regionEntrance
  EVENT_KIND_REGION_EXITING = 5;  // regionExiting
  EVENT_KIND_TAMPER = 6;          // shelteralarm / tamperdetection
  EVENT_KIND_SCENE_CHANGE = 7;    // scenechangedetection
  EVENT_KIND_VIDEO_LOSS = 8;      // videoloss while active
  EVENT_KIND_OTHER = 9;
}

// While an event lasts the camera repeats a notification about once a second
// and does not say when the event ends. gohome sends one ACTIVE when an event
// starts and one INACTIVE once 10 s have passed without a repeat and a later
// message, such as the camera's ten-second keep-alive, shows the stream is
// still alive.
enum EventState {
  EVENT_STATE_UNSPECIFIED = 0;
  EVENT_STATE_ACTIVE = 1;   // the event started
  EVENT_STATE_INACTIVE = 2; // the event ended
}

message HikvisionConfig {
  // Camera origin, including the HTTP port, e.g. http://192.0.2.20.
  string base_url = 1;
  // File holding one line, "username:password". Read-only secret (agenix).
  string credentials_file = 2;
}

message Identity {
  string device_name = 1;
  string model = 2;
  string serial_number = 3;
  string mac_address = 4;
  string firmware_version = 5;      // e.g. V5.0.0
  string firmware_build = 6;        // e.g. build 200101
  string encoder_version = 7;
  string hardware_version = 8;
  string firmware_version_info = 9; // hardware platform, as the camera reports it
}

message MotionDetection {
  bool enabled = 1;
  int32 sensitivity = 2; // 0-100
  // The targets motion is filtered to (AcuSense). Empty: any motion.
  repeated DetectionTarget targets = 3;
}

message SmartRule {
  uint32 id = 1;
  bool enabled = 2;
  int32 sensitivity = 3; // 1-100
  DetectionTarget target = 4;
}

// Line crossing or intrusion: one switch for the event and up to four rules.
message SmartDetection {
  bool enabled = 1;
  repeated DetectionTarget supported_targets = 2;
  repeated SmartRule rules = 3;
}

message AlertStreamStatus {
  bool connected = 1;
  google.protobuf.Timestamp connected_since = 2;
  // Any message, including the camera's keep-alive every ten seconds.
  google.protobuf.Timestamp last_message = 3;
  // Why the last connection ended or failed. Empty while connected.
  string last_error = 4;
}

message Camera {
  Identity identity = 1;
  // Event capabilities the camera reports as supported, in its own words
  // (e.g. "MotionDetection", "LineDetection", "FieldDetection").
  repeated string supported_events = 2;
  MotionDetection motion = 3;
  SmartDetection line_crossing = 4;
  SmartDetection intrusion = 5;
  AlertStreamStatus alert_stream = 6;
}

// The start or end of one raw event from the camera's alert stream. Raw:
// motion here is everything the camera's motion detector reacts to, before
// its people-and-vehicle filter, so most of it is wind, shadows and light.
// The filtered alarms the camera acts on are Alarm. An end carries the fields
// of the event's last notification, so its times say when the event was last
// seen; it arrives 10 to 20 s after that.
message CameraEvent {
  EventKind kind = 1;
  EventState state = 2;
  DetectionTarget target = 3;
  // The camera's clock. Check it against received_at before correlating.
  google.protobuf.Timestamp camera_time = 4;
  // When gohome received the notification.
  google.protobuf.Timestamp received_at = 5;
  uint32 channel_id = 6;
  // The smart-event rule that fired (line or region). 0 when not given.
  uint32 rule_id = 7;
  string camera_event_type = 8;
  string camera_target = 9;
  // Camera notification sequence within an alarm, not a distinct-event count.
  optional uint32 active_post_count = 10;
  string event_description = 11;
  string channel_name = 12;
}

// Raw ISAPI status. Optional numbers are absent when the camera omits them.
message DeviceStatus {
  google.protobuf.Timestamp device_time = 1;
  optional double uptime_seconds = 2;
  optional double reboot_count = 3;
  repeated CPUStatus cpus = 4;
  repeated MemoryStatus memory = 5;
}
message CPUStatus {
  optional double usage_percent = 1;
}
message MemoryStatus {
  // Units vary by firmware and disagree with the generic ISAPI documentation.
  optional double usage_raw = 1;
  optional double available_raw = 2;
}
message StorageDevice {
  string storage = 1; // hdd or nas
  string id = 2;
  string status = 3; // ISAPI state, e.g. ok, error, unformatted, offline
  optional double capacity_megabytes = 4;
  optional double free_megabytes = 5;
  string property = 6; // RW, RO, Redund
}
message RecordingTrack {
  string id = 1;
  // Configuration flags, not evidence of recording in progress.
  optional bool enabled = 2;
  optional bool loop_enabled = 3;
  optional bool schedule_enabled = 4;
}
message GetDeviceStatusRequest {}
message GetDeviceStatusResponse {
  DeviceStatus device = 1;
  repeated StorageDevice storage = 2;
  optional double streaming_sessions = 3;
  repeated RecordingTrack recording_tracks = 4;
}

message GetCameraRequest {}

message GetCameraResponse {
  Camera camera = 1;
}

message GetSnapshotRequest {}

message GetSnapshotResponse {
  bytes jpeg = 1; // main stream, full resolution
  google.protobuf.Timestamp captured_at = 2;
}

message WatchEventsRequest {}

// One alarm the camera raised: a start and stop line in its own alarm log.
// These are the alarms its detection filter accepts (for motion filtered to
// people and vehicles: a person or vehicle), the filter its app
// notifications also come from. Times are the camera clock.
message Alarm {
  EventKind kind = 1;
  // ACTIVE when the alarm started, INACTIVE when it ended.
  EventState state = 2;
  uint32 channel_id = 3;
  google.protobuf.Timestamp started_at = 4;
  // Absent while the alarm is under way.
  google.protobuf.Timestamp ended_at = 5;
  // ended_at minus started_at. Absent while the alarm is under way.
  google.protobuf.Duration duration = 6;
  // The camera's log type for the start, e.g. "motionStart".
  string camera_alarm_type = 7;
  // When gohome first read this state from the camera's log. Later than the
  // camera time by the poll interval, or by any outage of the camera.
  google.protobuf.Timestamp seen_at = 8;
}

message ListAlarmsRequest {
  // Alarms that started at or after since and before until. until defaults
  // to now. The camera keeps about the last few weeks.
  google.protobuf.Timestamp since = 1;
  google.protobuf.Timestamp until = 2;
}

message ListAlarmsResponse {
  // Oldest first. An alarm whose end is not in the log yet has no ended_at.
  repeated Alarm alarms = 1;
}

message WatchAlarmsRequest {}

message GetFrameRequest {
  // The moment to show, e.g. an alarm's started_at. Read from the camera's
  // own recording; second precision.
  google.protobuf.Timestamp at = 1;
}

message GetFrameResponse {
  bytes jpeg = 1; // main stream, full resolution
  // The second the recording was read from.
  google.protobuf.Timestamp at = 2;
}

// Read-only. No method changes the camera.
service HikvisionService {
  // Current device load, storage health and space, video sessions and recording flags.
  rpc GetDeviceStatus(GetDeviceStatusRequest) returns (GetDeviceStatusResponse);
  // Identity, firmware, detection settings and alert-stream status.
  rpc GetCamera(GetCameraRequest) returns (GetCameraResponse);
  // One JPEG from the main stream.
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  // Each raw alert-stream event's start (ACTIVE) and end (INACTIVE), beginning with
  // the starts of events already under way. Each line-crossing or intrusion
  // rule is its own event. UNAVAILABLE while gohome is not connected to the
  // camera's event stream, and when it loses it: events under way then have
  // no end. A subscriber that falls behind is ended with RESOURCE_EXHAUSTED.
  // Reconnect after either.
  rpc WatchEvents(WatchEventsRequest) returns (stream CameraEvent);
  // Alarms the camera raised (its alarm log), oldest first.
  rpc ListAlarms(ListAlarmsRequest) returns (ListAlarmsResponse);
  // Each new alarm's start (ACTIVE) and end (INACTIVE), as the camera logs
  // them, beginning with alarms under way. gohome reads the log every five
  // seconds; an alarm logged before gohome started is never sent as new.
  // UNAVAILABLE while the log has been unreadable for a minute.
  rpc WatchAlarms(WatchAlarmsRequest) returns (stream Alarm);
  // One JPEG from the camera's own recording at a past moment. NOT_FOUND
  // when the camera has no recording at that time.
  rpc GetFrame(GetFrameRequest) returns (GetFrameResponse);
}
